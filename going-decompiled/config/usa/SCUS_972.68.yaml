    # (19 of USA's 40) slides every later unit +8 at 16 (#400, #405).
    subalign: 8
    # The SN linker filled inter-object alignment gaps with 0xCDCDCDCD. Needed
    # since the libgcc carve (#879) leaves a real gap at 0x120354.
    ld_fill_value: 0xCDCDCDCD
