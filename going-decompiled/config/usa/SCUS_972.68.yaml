      # libgcc.a members __divdi3 (_divdi3.o, 0x11FC68..0x120354) and __muldi3
      # (_muldi3.o, 0x121AB8..0x121B18) are LINKED from the verbatim GCC source
      # in going-decompiled/libgcc/ (built by tools/ee/build_libgcc.sh), never
      # transcribed into a game .c. The C units around them are the old
      # cod/015180 cut at the members' object boundaries, all 8-aligned as
      # SUBALIGN(8) requires. The ROM's 4-byte pad at 0x120354 (after _divdi3.o)
