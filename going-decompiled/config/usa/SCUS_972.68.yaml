      # 0x123024 is 0, not CDCD: it is the SDK's whole dp-bit.o's own assembler
      # alignment before dpcmp. A lone member has no such tail and SUBALIGN(8)
      # places nothing at 4 mod 8, so the word is a `zeropad` subsegment
      # (tools/splat_ext/zeropad.py): FILL 0 for that gap only, then CDCD again.
      - [0x021A98, c, cod/021A98] # core.text: libgcc _pure.o, _udivdi3.o, _umoddi3.o, dp-bit.o head (0x121B18..0x122F0F)
