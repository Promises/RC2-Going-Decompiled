segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100080
    # No parent bss_size: the group's rom span (0x0..0xA7400) maps linearly to
    # vram (0x100080..0x1A7480) via the constant 0x100080 delta, so the core.bss
    # subsegment infers exactly 0x6B400 (0x13C080..0x1A7480). Adding bss_size
    # here double-counts it (vram_end becomes 0x212880 -> bss 0xD6800).
    bss_size: 0x0
    subalign: null
    subsegments:
      - [0x000000, textbin, cod/000000] # .vutext
      - [0x015180, c, cod/015180] # core.text
      - [0x033B00, data, cod/033B00] # core.data
      - [0x03A180, rodata, cod/03A180] # core.rdata
