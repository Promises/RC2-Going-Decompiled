      - [0x0213D0, c, cod/0213D0] # core.text: libgcc _moddi3.o as asm (0x121450..0x121AB7)
      - [0x021A38, lib, libgcc, _muldi3] # libgcc.a _muldi3.o .text (0x121AB8..0x121B17)
