      # ld_fill_value (measured: FILL 0xCDCDCDCD on the uncarved master was
      # cmp 0, so no earlier gap depends on the fill). Phase 2 (task #893) adds
      # _fixunsdfdi.o and _floatdidf.o the same way; the ROM's pad at 0x1213B4
      # between them is that same CDCD fill.
      - [0x015180, c, cod/015180] # core.text head (0x115200..0x11FC67)
      - [0x01FBE8, lib, libgcc, _divdi3] # libgcc.a _divdi3.o .text (0x11FC68..0x120353), pad 0x120354
      - [0x0202D8, c, cod/0202D8] # core.text: libgcc _eh.o as asm/C, pad 0x1212C4 as a tail fragment (0x120358..0x1212C7)
