      - [0x03ABD8, lib, libgcc, _divdi3, .rodata] # libgcc.a _divdi3.o .rodata (__clz_tab, 0x13AC58..0x13AD57)
      - [0x03ACD8, rodata, cod/03ACD8] # core.rdata (0x13AD58..)
