  - name: bss
    type: code
    start: 0x0B1300
    vram: 0x001B1380
    # No parent bss_size: group rom span (0xB1300..0x138C00 = 0x87900) maps to
    # vram 0x1B1380..0x238C80, so .bss infers exactly 0x87900 (ends at .data).
    bss_size: 0x0
    subalign: null
    subsegments:
      - { type: bss, vram: 0x001B1380, name: bss/001B1380 } # .bss

