segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100080
    # No parent bss_size: group rom span (0x0..0xA7480) maps linearly to vram
    # (0x100080..0x1A7500), so core.bss infers exactly 0x6B400
    # (0x13C100..0x1A7500). bss_size here double-counts it.
    bss_size: 0x0
    # SUBALIGN(8), not the input objects' own 16: Sony's toolchain emitted
    # .text sh_addralign=8 (358/377 SDK objects, 19 at 4, none at 16) while
    # mips-linux-gnu-as stamps 16, and a text/cod unit whose size is 8 mod 16
    # (19 of USA's 40) slides every later unit +8 at 16 (#400, #405).
    subalign: 8
    subsegments:
      - [0x000000, textbin, cod/000000] # .vutext
      # R24 EU REGION-AXIS PILOT (2026-06-13): retyped asm->c to stand up the
      # FIRST EU per-function objdiff unit. Mirrors the USA head c-unit
      # (cod/015180). MEASURED: 100/105 USA-matched cod funcs are byte-shape-
      # identical in EU (67 byte-identical, 33 reloc-only deltas = the +0x80
      # global/gp shift, gp EU 0x1AF070 vs USA 0x1AEFF0); the engine head
      # (0x115200..0x131620) is a clean mirror. The crt0/entry cluster
      # (0x131628.. incl _start EU 0x131b48 vs USA 0x131ae8) genuinely diverges
      # (PAL/NTSC boot, BCD clock) and stays INCLUDE_ASM. Kept as ONE c unit
      # (not the USA 3-way snd/-G8 carve, whose boundaries sit in the diverged
      # zone) for a -G0 pilot. EU text is 0x80 longer than USA (core.data at
      # vram 0x133C00 vs USA 0x133B80).
      # SND SUB-TU CARVE (EU mirror, 2026-06-13): the 989snd/CD-bridge sub-TU is
      # carved out of cod/015180 into its own c unit cod/0321A0 compiled at
      # -O2 -G8 (mirrors the USA cod/0321A0 carve). EU boundaries SIGNATURE-
      # matched (NOT a fixed +0x80): snd_ServiceRpcCompletion at EU vaddr
      # 0x132280 (USA 0x132220, delta +0x60) -> fileoff 0x032200; the snd block
      # ends at OnVblankInterrupt (EU 0x133A10/USA 0x1339B0) and the tail unit
      # cod/033970 (func_001339F0 equiv at EU vaddr 0x133A50/USA 0x1339F0)
      # begins -> fileoff 0x0339D0. The tail stays at -G0. fileoff -> vaddr is
      # the constant +0x100080 delta.
      - [0x015180, c, cod/015180] # core.text head (EU mirror, -G0)
      - [0x032200, c, cod/0321A0] # snd sub-TU, built at -G8 (EU 0x132280..0x133A0F)
      - [0x0339D0, c, cod/033970] # core.text tail (EU 0x133A50.., -G0)
      - [0x033B80, data, cod/033B80] # core.data
      - [0x03A200, rodata, cod/03A200] # core.rdata
      # ROM-anchor the bss at 0x3C080 (= vram 0x13C100) so splat BOUNDS the rodata
      # there instead of over-extending it across the bss region (mirrors the USA
      # cod/03A180 fix). Without the anchor the rodata absorbed the bss zeros as
      # ~437KB .rodata AND the bss was declared on top -> double-emitted, inflating
      # .cod so the flowing .cod_bss overlapped .core_lit. Anchored, the rodata
      # ends at 0x3C080 and the bss is the lone NOBITS region (size inferred from
      # the constant +0x100080 linear delta, exactly as before).
      - [0x03C080, bss, cod/0013C100] # core.bss

  - name: core.lit
    type: code
    start: 0x0A7480
    vram: 0x001A7500
    bss_size: 0x0
    subalign: null
    subsegments:
      - [0x0A7480, data, core.lit/0A7480] # core.lit

  - name: lit
    type: code
    start: 0x0A7C80
